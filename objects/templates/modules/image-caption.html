<p><small class="py-2">
    <em>{{ image.title}}</em>
    {% if image.author_url %}
        by <a class="hyper-link" href="{{ image.author_url }}" target="_blank">{{ image.author_name }},</a>
    {% elif image.author_name %}
        by {{ image.author_name}},
    {% endif %}
    <time datetime="{{ image.publication_date|date:'Y-m-d' }}">{{ image.publication_date }}</time>:
    {{ image.description }}
</small></p>
