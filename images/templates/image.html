{% extends "base.html" %}
{% load static %}

{% block head %}
    <link rel="stylesheet" href="{% static 'css/image.css' %}">
{% endblock %}

{% block meta %}
    <title>{{ image.title }}</title>
    <meta property="og:title" content="{{ image.title }}">
    <meta property="og:description" content="{{ image.caption|striptags }}">
    <meta property="og:image" content="{{ image.image.url }}">
    <meta property="og:url" content ="https://dawnhyper.media{{ image.get_absolute_url }}">
    <meta property="og:site_name" content="Dawn Hypermedia">

    <meta property="og:type" content="article">
    <meta property="article:author" content="{{ image.author }}">
    <meta property="article:published_time" content="{{ image.publication_date|date:'Y-m-d' }}">
    <meta property="article:keywords" content="{{ image.keywords }}">
{% endblock %}

{% block body %}

    <div class="row px-sm-5 py-5">
        <div class="col-lg-8 mx-auto">

            <p class="section hyper-medium">[ Image ]</p>

            <img class="img-fluid image-image" src="{{ image.image.url }}">

            {% include 'modules/image-caption.html' with image=image %}

        </div>
    </div>

{% endblock %}
