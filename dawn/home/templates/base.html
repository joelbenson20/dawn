{% load static %}

<!DOCTYPE html>
<html lang="en">

    <head>


        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <link rel="stylesheet" href="{% static 'css/base.css' %}">
        <link rel="stylesheet" href="{% static 'boot/css/bootstrap.min.css' %}">
        <link rel="stylesheet" href="{% static 'fontawesome/css/fontawesome.css' %}">
        <link rel="stylesheet" href="{% static 'fontawesome/css/solid.css' %}">

        <script src="{% static 'boot/js/bootstrap.js' %}"></script>

        {% block title %}
            <title>#Dawn | hypermedia</title>
        {% endblock %}

        {% block head %}
        {% endblock %}

    </head>

    <body>

        <div class="container-fluid" id="window-container">

            <nav class="navbar navbar-dark navbar-expand-md p-3">
                <div class="container-fluid">
                    <a class="navbar-brand hyper" href="{% url 'index' %}">#</a>
                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarContent">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                    <div class="collapse navbar-collapse" id="navbarSupportedContent">
                        <ul class="navbar-nav">
                            <li class="nav-item">
                                <a class="nav-link" href="{% url 'index' %}">Home</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="{% url 'index' %}">About</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="{% url 'index' %}">Submit</a>
                            </li>
                        </ul>
                    </div>
                </div>
            </nav>

            {% block body %}
            {% endblock %}
        </div>
    </body>

</html>
