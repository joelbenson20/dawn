{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    <link rel="stylesheet" href="{% static 'boot/css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'fontawesome/css/fontawesome.css' %}">
    <link rel="stylesheet" href="{% static 'fontawesome/css/solid.css' %}">

    <script src="{% static 'boot/js/bootstrap.js' %}"></script>

    {% block head %}
    {% endblock %}

    {% block meta %}
        <title>Dawn Hypermedia</title>
        <meta property="og:title" content="Dawn Hypermedia">
        <meta property="og:type" content="website">
        <meta property="og:image" content="{% static 'images/DawnHypermediaBanner.png' %}">
        <meta property="og:url" content="https://dawnhyper.media">
        <meta property="og:description" content="A publisher of digital art.">
        <meta property="og:determiner" content="">
        <meta property="og:site_name" content="Dawn Hypermedia">
    {% endblock %}

    <link rel="apple-touch-icon" sizes="180x180" href="{% static 'images/favicon/apple-touch-icon.png' %}">
    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'images/favicon/favicon-32x32.png' %}">
    <link rel="icon" type="image/png" sizes="16x16" href="{% static 'images/favicon/favicon-16x16.png' %}">
    <link rel="manifest" href="{% static 'images/favicon/site.webmanifest' %}">

</head>

<body style="background-color: #000010;">
    <div class="container-fluid p-0 m-0" id="window-container">


        <nav class="navbar navbar-dark navbar-expand-md sticky-top m-0 p-0">
            <div class="container-fluid m-0 p-0">
                <a class="navbar-brand p-0" href="{% url 'index' %}">
                    <img class="navbar-brand-image" src="{% static 'images/DawnHypermedia.png' %}" width="200">
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarContent">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse p-4" id="navbarSupportedContent">
                    <ul class="navbar-nav">
                        <li class="nav-item">
                            <a class="nav-link hyper-medium" href="{% url 'index' %}">Home</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link hyper-medium" href="{% url 'index' %}">Submissions</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>

        {% block body %}
        {% endblock %}

        <div class="generator sticky-bottom p-0 m-0">
            <div class="blur-0 block"></div>
            <div class="blur-1 block"></div>
            <div class="blur-2 block"></div>
            <div class="blur-3 block"></div>
            <div class="blur-4 block"></div>
            <div class="blur-5 block"></div>
            <div class="blur-6 block"></div>
            <div class="blur-7 block"></div>
            <div class="blur-8 block"></div>
        </div>

    </div>
</body>
