<small class="py-2">
    <em>{{ image.title}}</em>
    {% if image.author_url %}
        by <a class="hyper" href="{{ image.author_url }}" target="_blank">{{ image.author }}</a>,
    {% elif image.author %}
        by {{ image.author}},
    {% endif %}
    <time datetime="{{ image.publication_date|date:'Y-m-d' }}">{{ image.publication_date }}</time>:
    {{ image.caption|safe }}
</small>
